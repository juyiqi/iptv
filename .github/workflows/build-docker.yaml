# 快手直播定制版 iptv 镜像构建
#
# 本仓库不放完整源码（上游 1000+ 文件），只放「叠加层」：
#   overlay/ 里的文件会在构建时覆盖到上游 akiralereal/iptv 之上。
# 当前叠加内容 = 快手直播模块（手动房间 + 分类两种模式）。
#
# 产物：ghcr.io/<owner>/iptv:latest 和 ghcr.io/<owner>/iptv:v<上游版本号>
# 平台：linux/amd64 + linux/arm64（各用原生 runner，不走 QEMU）

name: build-docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/iptv
  UPSTREAM: https://github.com/akiralereal/iptv.git

jobs:
  build:
    name: build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            artifact: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            artifact: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout 本仓库（叠加层）
        uses: actions/checkout@v6

      - name: 拉取上游源码并叠加改动
        run: |
          git clone --depth 1 "$UPSTREAM" upstream
          cp -a overlay/. upstream/
          cd upstream
          if ! grep -q "kuaishou-live" extractors/registry.js; then
            echo "::error::叠加后 registry.js 里没有 kuaishou-live，上游结构可能变了"
            exit 1
          fi

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./upstream
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: 合成多架构清单
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 取上游版本号
        run: |
          VERSION=$(curl -fsSL https://raw.githubusercontent.com/akiralereal/iptv/main/package.json \
            | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          echo "UPSTREAM_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            -t "$IMAGE:v$UPSTREAM_VERSION" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect "$IMAGE:latest"
